<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cam's Corner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f4fdd9" />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <main class="container">
      <div class="section">
        <p><strong>Pokeordle</strong></p>
        <p>The best looking Pokemon-based Wordle clone!</p>
        <p>
          <a href="https://pokeordle.com"
            ><img src="pokeordle.png" alt="link to pokeordle"
          /></a>
        </p>
      </div>
      <div class="section">
        <p><strong>Wordsmith</strong></p>
        <p>
          Join a league with your friends to see who can write the best short
          story!
        </p>
        <p class="image-container">
          <a href="https://wordsmith-game.com">
            <img class="pic-1" src="wordsmith.png" alt="link to wordsmith" />
            <img class="pic-2" src="wordsmith2.png" alt=""
          /></a>
        </p>
      </div>
      <div class="section">
        <p><strong>My Places</strong></p>
        <p>Save your own personal list of restaurants</p>
        <p class="image-container">
          <a href="https://lets-go-to.vercel.app">
            <img class="portrait" src="andreas-places.png" alt="link to my places" />
          </a>
        </p>
      </div>
    </main>
  </body>
</html>
